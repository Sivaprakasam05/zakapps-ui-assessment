<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login – MotorVault</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚘</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .auth-logo {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }

        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 0.4rem;
        }

        .auth-sub {
            text-align: center;
            font-size: 0.875rem;
            color: #888;
            margin: 0 0 2rem;
        }

        .auth-sub a {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-sub a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 0.9rem;
        }

        .input-wrap input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 0.75rem 2.8rem 0.75rem 2.6rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
        }

        .input-wrap input:focus {
            border-color: #e63946;
        }

        .input-wrap input::placeholder {
            color: #555;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }

        .toggle-pw:hover {
            color: #aaa;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #aaa;
            cursor: pointer;
        }

        .remember-label input[type="checkbox"] {
            accent-color: #e63946;
            width: 15px;
            height: 15px;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: #e63946;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }

        .auth-btn:hover {
            background: #c1121f;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.5rem 0;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: #2a2a2a;
        }

        .divider p {
            font-size: 0.8rem;
            color: #555;
            margin: 0;
            white-space: nowrap;
        }

        .social-btns {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 0.7rem;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border 0.2s, color 0.2s;
            text-decoration: none;
        }

        .social-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .auth-msg {
            margin-top: 1rem;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .auth-msg.error {
            background: #2d0a0a;
            color: #ff6b6b;
            border: 1px solid #5c1a1a;
            display: block;
        }

        .auth-msg.success {
            background: #0a2d14;
            color: #6bffaa;
            border: 1px solid #1a5c34;
            display: block;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #555;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #aaa;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.25rem;
            }

            .social-btns {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">🚘</div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Don't have an account? <a href="register.html">Sign up</a></p>

            <div class="form-group">
                <label for="loginEmail">Email</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password"
                        autocomplete="current-password" />
                    <button class="toggle-pw" onclick="togglePw('loginPassword', this)" type="button"
                        aria-label="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-label">
                    <input type="checkbox" id="rememberMe" /> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="alert('Password reset coming soon!'); return false;">Forgot
                    password?</a>
            </div>

            <button class="auth-btn" onclick="handleLogin()">Login</button>
            <div class="auth-msg" id="loginMsg"></div>

            <div class="divider"><span></span>
                <p>or continue with</p><span></span>
            </div>

            <div class="social-btns">
                <a href="#" class="social-btn" onclick="alert('Google login coming soon!'); return false;">
                    <i class="fa-brands fa-google"></i> Google
                </a>
                <a href="#" class="social-btn" onclick="alert('Facebook login coming soon!'); return false;">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                </a>
            </div>

            <a href="index.html" class="back-home">← Back to MotorVault</a>
        </div>
    </div>

    <script>
        function togglePw(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMsg');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            msg.className = 'auth-msg';

            if (!email || !password) {
                msg.textContent = '⚠️ Please fill in all fields.';
                msg.classList.add('error');
                return;
            }

            if (!emailRegex.test(email)) {
                msg.textContent = '⚠️ Please enter a valid email address.';
                msg.classList.add('error');
                return;
            }

            if (password.length < 6) {
                msg.textContent = '⚠️ Password must be at least 6 characters.';
                msg.classList.add('error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('mv_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                msg.textContent = '⚠️ Invalid email or password.';
                msg.classList.add('error');
                return;
            }

            localStorage.setItem('mv_loggedIn', JSON.stringify(user));
            msg.textContent = '✓ Login successful! Redirecting...';
            msg.classList.add('success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1200);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>

</html>
